<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script>
    (function () {
      var h = location.hostname;
      if (h !== "allcitypros.com" && h !== "www.allcitypros.com") return;
      var id = "G-4VYWLM1N6T";
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name='impact-site-verification' value='6b714473-0498-4933-83ec-09fb32acd5fa'>
    <title>{{Name}} - {{City}} | AllCityPros</title>
    <link rel="stylesheet" href="/templates/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>{{Name}}</h1>
            <p style="color: var(--text-muted)">Verified provider in {{City}}</p>
            <p class="description">{{Description}}</p>
        </header>

        <div class="card">
            <h3>Customer Reviews</h3>
            <p><strong>Rating: 4.8/5</strong> based on local sentiment.</p>
            <form id="review-form" onsubmit="return false;">
                <textarea id="review" placeholder="Write a review for {{Name}}..." rows="3" style="width: 100%; margin-bottom: 10px;"></textarea>
                <button type="button" onclick="alert('Thank you for your review!')" class="cta-button">Submit Review</button>
            </form>
        </div>

        <div class="card">
            <h3>Ready to get started?</h3>
            <p>Connect with professional services in your area.</p>
            <a href="{{AffiliateLink}}" class="cta-button">Request a Quote</a>
        </div>
    </div>
</body>
</html>
